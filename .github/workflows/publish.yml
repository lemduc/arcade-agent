name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual fallback: dispatch on a pushed release tag (e.g. v0.3.0) to publish
  # that tag to PyPI and create its GitHub release in one run.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0

      # Runs created via workflow_dispatch have no release object yet; create
      # it after a successful publish. (GITHUB_TOKEN-created releases do not
      # re-trigger this workflow, so this cannot double-publish.)
      - name: Create GitHub release (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
